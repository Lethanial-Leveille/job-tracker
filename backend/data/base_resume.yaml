# The BASE resume: one general-purpose, one-page resume to hand out when there
# is no specific job to tailor against.
#
# This is a SELECTION from master_resume.yaml, not a second source of truth.
# Every bullet here is the same claim as its master counterpart, trimmed for
# length — nothing is added. When the master gains a fact worth leading with,
# copy it down here by hand; nothing syncs automatically.
#
# Bullets carry ONE **bold** span each, rendered by the `bold` filter in
# services/resume_render.py. Bold the RESULT or the hard technical noun, never
# the problem: read every bolded fragment on the page in sequence and it should
# sound like a highlight reel. (Tailored resumes let Claude re-place the span per
# job; this file is the untailored one, so the spans are chosen by hand.)
#
# Render it with:
#   python scripts/build_base_resume.py

