    role: Test Prep Tutor
    location: Remote
    dates: August 2026 – Present
    bullets:
      - "tutoring ACT and SAT English, Reading, and Math"
  - organization: ACM
    role: Design Team
    location: Gainesville, FL
    dates: September 2026 – Present
    bullets: []
