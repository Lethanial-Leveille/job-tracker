# Master resume — the single source of truth for your resume CONTENT.
#
# This file is the "bullet bank": keep EVERY project, every bullet, and every
# real metric here. Tailoring reads this, then for a given job it selects a
# subset of projects, keeps the strongest ~4 bullets per entry, reorders, and
# rephrases — using only what is already written here. It never invents.
#
# Everything below is drawn from your actual repos, commit history, project
# writeups, and current resume. Anything I could not verify is marked "TODO:".
# Numbers all trace to a real source; none are made up.
#
# NOTE (see CLAUDE.md hard rule #6): this tracker is itself the "Prowl" project
# below. When it gains a feature or tool, its entry gets updated.
#
# Shape matches backend/schemas/resume.py.
#
# ---------------------------------------------------------------------------
# WRITING RULE for every bullet in this file (added Sep 2026):
#
#   First half = the OUTCOME, in plain English a non-engineer understands.
#   Second half = the MECHANISM, naming the technology for an engineer.
#
# A recruiter screens the resume before any engineer sees it, and they stop
# reading at the first unfamiliar noun. Two rules decide every term:
#
#   1. NAME THE PROPERTY, NOT YOUR COMPANY'S NAME FOR THE MECHANISM.
#      "idempotent" (in real job postings) beats "single-use atomic claim"
#      (Fuzzy's phrasing, lifted from Lee's own PR body). "state machine" beats
#      "tick supersession". Banned outright: jargon that only meant something
#      inside one company ("Memories", "enrichment", "chore", "prompter").
#
#   2. ONE SPECIALIST TERM PER BULLET, two only if one of them is the flex.
#      An early draft of the MILES voice bullet carried five in one sentence
#      (energy VAD, -53 dBFS, enrollment centroid, webrtcvad, pre-roll buffer).
#      That reads as showing off and a recruiter stops at term two. Keep the one
#      that proves depth, say the rest in plain words.
#
# Never open a bullet with the implementation. Percentages use the symbol (51%,
# not "51 percent"). Never state a test pass count as an accomplishment — every
# merged change has passing tests; what earns a line is a test PROVEN to fail
# against the old code.
#
# THE BANK IS A SUPERSET (CLAUDE.md hard rule #6: keep every real detail here).
# Rewriting a bullet means ADDING the new wording above and DEMOTING the old one
# to the bench, never replacing it. Learned the hard way on 2026-09-03: a plain-
# English rewrite pass replaced the detailed bullets outright and quietly deleted
# StreamRouter, WAL mode, partial-write claim recovery, pg_dump backups, the
# least-privilege deploy user, MiniLM/IDF, -53 dBFS and Keychain from the file.
# The printed resume should be short; this file should not.
#
# ORDERING CONVENTION: within each bullets list, the resume-default bullets come
# FIRST, already written in the plain style above. Everything below the
# "bench" comment is real and true but denser; if tailoring promotes one, it
# still needs the plain-English rewrite before it prints.
#
# BOLD: ONE fragment per bullet, marked **like this**; services/resume_render.py
# has a `bold` filter that escapes first, then renders the marker as <strong>.
#
# WHAT TO BOLD: the result or the hard technical noun. NEVER the problem. The
# test is to read every bolded fragment on the page in sequence and ask whether
# it sounds like a highlight reel. "jumped to the wrong place" and "fake
# analytics events" failed that test badly - a skimmer saw defects next to your
# name - which is why the inbox bullet now bolds "scroll state machine" instead.
# You mark them here; the
# tailoring model may reorder and rephrase but must preserve markers and may
# never add its own (that would hand layout control back to the model, which is
# exactly what the locked template exists to prevent).
# ---------------------------------------------------------------------------

