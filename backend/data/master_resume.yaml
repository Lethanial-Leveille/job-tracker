  - name: Prowl (Job Application Tracker)
    # This project. Per CLAUDE.md hard rule #6, update this entry as the tracker grows.
    tools: [Python, FastAPI, SQLAlchemy 2.0, Alembic, PostgreSQL, SQLite, React, TypeScript, Vite, Tailwind CSS, Claude API, WeasyPrint, Jinja, JWT, bcrypt, DigitalOcean, Linux, Caddy, Cloudflare Tunnel, systemd, GitHub Actions]
    links:
      - github.com/Lethanial-Leveille/job-tracker
    dates: July 2026 – Present
    bullets:
      - Building a full-stack tracker for internship applications with a FastAPI + SQLAlchemy 2.0 backend (Alembic migrations, PostgreSQL in production) and a React + TypeScript + Vite + Tailwind dark-theme frontend.
      - Migrated the database from SQLite to PostgreSQL behind an env-driven connection URL, gating the SQLite-only migration workarounds by dialect and verifying the full migration chain on Postgres so the same code runs on both.
      - Layered the backend into thin routers, a service layer for business logic, and Pydantic request/response schemas, with dependency-injected DB sessions and an in-memory SQLite test suite that never touches the real database.
      - Integrated the Claude API to parse pasted job descriptions into structured fields via structured outputs (typed Pydantic), running the cheaper Haiku model with the model swappable through configuration.
      - Built an AI resume-tailoring pipeline that selects and rephrases bullets from a YAML master resume against a job description using Claude (Opus via structured outputs, constrained to never invent content), then renders a one-page PDF through a locked Jinja and WeasyPrint template, separating content from format so the model cannot alter layout.
      - Persisted reviewed tailored resumes as immutable, append-only versions per application in a foreign-keyed table, keeping tailoring a draft step that the user reviews and saves explicitly so nothing is auto-submitted.
      - Grew the tracker into a multi-user product with each user's master resume stored in the database and a React resume builder (a guided wizard for first-time entry, a scrollable editor for later edits), where a career-stage setting renders the same content as either a student or professional layout through the same locked template.
      - Implemented JWT authentication with bcrypt-hashed passwords and scoped every record to its owner through a foreign-keyed user_id, guarding all routes by default with fail-safe router-level dependencies and proving isolation with cross-user tests, so the single-user app can become multi-user without reworking data access.
      - "Deployed to production on a DigitalOcean droplet (Ubuntu): the built React frontend and FastAPI backend are served same-origin behind Caddy, the backend runs under systemd, and the site is exposed over HTTPS through a Cloudflare Tunnel with no open ports or public IP, backed by nightly pg_dump database backups."
      - Cut a routine pipeline update from five interactions to two by making the status cell editable in place with an optimistic update that patches a single field and rolls back on failure, and trimmed a fourteen-value status enum to a six-value working set in the UI rather than by migration, so stored history stayed valid.
      - Added client-side duplicate detection that catches an already-tracked posting before the paid parsing call runs, matching on a normalized URL that strips tracking parameters while preserving job-board job ids, then on employer and title similarity with light stemming so the same role posted to two boards is still caught.
      - Collapsed a three-layer interface of stacked slide-over panels and a modal into a single-layer view swap with tabs, keeping both tabs mounted behind CSS so switching between them neither discards unsaved edits nor re-runs a paid model call, and moved resume tailoring to start automatically when its tab is first opened.
      - Added a requirements-match feature that compares a posting's extracted requirements against the stored master resume with Claude and reports a met, partial, or missing verdict with cited evidence for each, computing the totals in application code rather than trusting the model to count and recording an explicit unknown for any item the model skips so a dropped answer cannot inflate the score.
      - Added an opt-in grouping view that collects several applications to one employer under a shared header, reconciling inconsistent company spellings through a shared normalization function and ordering groups by their soonest deadline so the list's urgency ordering survives.
      - Introduced a Vitest suite for the frontend's pure logic (duplicate matching, status lists, grouping) alongside the existing pytest suite, writing the tests around the failure modes that silently produce wrong output rather than around coverage.
      - Extended requirement matching to parse a posting's required and preferred qualification lists separately and report them apart, so the headline score reflects the hard gates while the preferred list surfaces what actually differentiates candidates and what to emphasize when tailoring.
      - Automated deployment with a GitHub Actions pipeline so every push to main rebuilds, runs migrations, and restarts the app on the droplet, connecting as a least-privilege deploy user allowed only a single scoped sudo command.
