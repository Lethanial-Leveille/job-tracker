      - "Rebuilt 4 inconsistent contact import flows into 1 shared review step so users confirm exactly who gets added **before anyone is imported or charged**, backed by a preview endpoint that stages candidates without creating any records."
      - "Traced a background poll firing **~30 phantom analytics events per user per minute**, permanently inflating the exact adoption metric the feature was judged on, and scoped emission to foreground fetches so a silent watch tick can no longer write events."
      - "Built the app half of a cross-domain signup attribution pipeline across 3 repositories, capturing marketing source at all 3 account-creation paths including the Google OAuth paths that carry **51% of signups** and previously recorded nothing at all."
      - "Rebuilt the inbox message thread as a scroll state machine, fixing 4 distinct failures: flicker on open, lost reading position when older messages load in above you, a race where a slow request overwrote a different conversation, and duplicate page loads."
      - "Raised **diff coverage from 36% to 100%** against the CI gate by extracting the timing-sensitive decision logic out of a 6,500 line component into pure, unit-tested helpers."
      # --- bench: true, but rewrite in the plain style above before printing ---
