  links:
  - github.com/Lethanial-Leveille/miles
  dates: April 2026 – Present
  bullets:
  - Built a voice assistant on a Raspberry Pi 5 that answers out loud in **~520 ms**, 1.5 s faster than the first working version, by streaming ElevenLabs TTS straight to ALSA, with Whisper.cpp transcription and openWakeWord detection at 90.4% recall.
  - 'Isolated 4 compounding defects behind a broken speaker verification path: a mic trigger that never fired, a corrupted enrollment sample, gain leaving 7 of 16 bits unused, and a loop that could not exit. Reached **zero false rejections across 94 attempts**.'
  - Built hybrid memory retrieval over a 233-memory corpus, fusing keyword search with semantic vector search through **reciprocal rank fusion at 31 ms per query**, so two differently-scaled rankings vote without either being rescaled onto the other.
  - Shipped a JWT-authenticated FastAPI backend (REST and WebSocket) and a zero-dependency SwiftUI iOS client with Face ID and Keychain-stored tokens, deployed as 3 systemd services reachable globally through a Cloudflare Tunnel with no open ports.
  - Added custom wake-word detection via openWakeWord (90.4% recall), on-device Whisper.cpp speech-to-text, and speaker verification through 256-dimensional voice embeddings (cosine similarity, 0.65 threshold).
  - Migrated the assistant off hand-parsed bracket action tags onto native Claude tool use behind a single tool registry (six live tools), bounding the follow-up loop and deleting the 50-character lookahead buffer that had sat directly on the path to first audio.
  - 'Designed a rank-based authorization model that keeps recognition separate from access: the prompt corpus is assembled per tier, so a fact below the owner tier is never in the context at all rather than being withheld by instruction, proven by tests asserting no personal name appears at any lower tier.'
  - Cut turn latency by capping the Whisper audio context after measuring transcription flat at ~2000ms regardless of clip length (the encoder pads every clip to 30 seconds), then moving the follow-up call to Haiku with prompt caching.
  - Added wake-word barge-in during playback without acoustic echo cancellation, using a watcher thread that exclusively owns the mic stream for the span playback drains and kills it on a hit, keyed on a phrase the assistant's own speech never contains.
  - 'Built incremental voiceprint learning from ordinary conversation with a rolling 60-sample window, admitting samples only well clear of the accept threshold and never applying an update automatically: a preview tool shows what an update would move, backs up the profile first, and refuses to average across microphones.'
  - 'Built the SwiftUI companion app from scratch with zero third-party dependencies: Face ID auth, on-device SFSpeechRecognizer input, paginated history with search, and a memory-bank viewer.'
  - Built a JWT-authenticated FastAPI backend (REST and WebSocket) with persistent SQLite memory in WAL mode and Claude API streaming, using a stop-sequence plus look-ahead StreamRouter to detect action tags mid-stream.
  - Pipelined ElevenLabs TTS straight to ALSA and cut time-to-first-audio to ~520ms, including a 1.5s latency win from flushing stdin after every audio chunk.
  - Deployed three systemd services on boot with global access via Cloudflare Tunnel at miles.lethanial.com, consumed by the iOS app with Face ID and Keychain-stored JWTs.
  - Built hybrid memory retrieval over a 233-memory SQLite corpus, fusing FTS5 keyword search ranked by summed inverse document frequency with all-MiniLM-L6-v2 semantic search (384-dimensional float32 vectors, 31ms per query) through reciprocal rank fusion, so two uncalibrated scoring scales vote without either being mapped onto the other.
  - Diagnosed months of speaker-verification false rejections down to four compounding defects (an energy VAD that never fired at -53 dBFS capture, a follow-up loop that could not exit on hallucinated transcripts, an enrollment centroid poisoned to 0.63 average pairwise similarity, and mic gain leaving 7 of 16 bits unused), replacing the energy threshold with webrtcvad plus a 300ms pre-roll ring buffer and adding per-attempt logging that showed zero rejections across 94 attempts over two seconds.
- name: Job Application Tracker (Prowl)
  tools:
  - Python
  - FastAPI
  - SQLAlchemy 2.0
  - Alembic
