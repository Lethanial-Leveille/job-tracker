  - n8n
  links:
  - github.com/Lethanial-Leveille/job-tracker
  dates: July 2026 – Present
  bullets:
  - 'Built the job tracker I apply with: it parses a pasted posting with the Claude API and tailors my resume against it, rendering a one page PDF through a locked Jinja and WeasyPrint template so the model rewrites content but never layout.'
  - Cut a routine status update from **5 interactions to 2** with an in-place editable cell driven by an optimistic update that rolls back on failure, and trimmed a 14-value status enum to a 6-value working set in the UI rather than by migration.
  - Added duplicate detection that blocks an already-tracked posting **before it reaches the paid parsing call**, matching on a URL normalized to strip tracking parameters while preserving job-board ids, then on employer and title similarity.
  - Automated releases with **GitHub Actions** so every push to main rebuilds, migrates, and restarts the app on a DigitalOcean droplet behind Caddy and a Cloudflare Tunnel, connecting as a least-privilege deploy user limited to 1 scoped sudo command.
  - Let the tailoring model choose which fragment of each bullet to emphasize for a given job, then capped it at one span per bullet in application code rather than in the prompt, because models over-emphasize and bold covering half a page stops being a highlight.
  - Read each posting's eligibility text to suggest which graduation date to print, citing the phrase it matched so the suggestion can be judged rather than trusted, and left the switch manual because a wrong automatic flip prints a date the user never chose.
  - Named every resume download Lastname_Firstname_Resume_Company from the server rather than the browser, so the naming convention lives in one place, and allowlisted the characters because company names arrive from parsed postings into a response header.
  - Modeled two simultaneously-true graduation dates as one resume with a render-time selector instead of a second file, so an early and a standard track cannot drift apart and every other fact stays shared by construction.
  - Implemented JWT authentication with bcrypt-hashed passwords and scoped every record to its owner through a foreign-keyed user_id, guarding all routes by default with fail-safe router-level dependencies and proving isolation with cross-user tests.
  - Grew the tracker into a multi-user product with each user's master resume stored in the database and a React resume builder (a guided wizard for first-time entry, a scrollable editor for later edits), where a career-stage setting renders the same content as either a student or professional layout through the same locked template.
  - Added a requirements-match feature that compares a posting's extracted requirements against the stored master resume with Claude and reports a met, partial, or missing verdict with cited evidence for each, computing the totals in application code rather than trusting the model to count and recording an explicit unknown for any item the model skips so a dropped answer cannot inflate the score.
  - Extended requirement matching to parse a posting's required and preferred qualification lists separately and report them apart, so the headline score reflects the hard gates while the preferred list surfaces what actually differentiates candidates.
  - Built a Gmail ingestion pipeline spanning a home Raspberry Pi and the production droplet, where n8n handles only OAuth and polling while the tracker owns classification, matching, and staging, authenticated by a separate service-token path with a constant-time comparison that rejects every call when no token is configured.
  - 'Designed the email pipeline to propose rather than decide: a classified message stages a suggested status change for one-click review instead of flipping it, and stages the candidate applications instead of guessing when it matches more than one, because a wrong silent status change is invisible until a deadline has already passed.'
  - Added a status-history timeline recording every change and whether it came from a click or an email, so an application that reached an interview before a rejection reads as its real path instead of collapsing to a single current status.
  - Migrated the database from SQLite to PostgreSQL behind an env-driven connection URL, gating the SQLite-only migration workarounds by dialect and verifying the full migration chain on Postgres so the same code runs on both.
  - Layered the backend into thin routers, a service layer for business logic, and Pydantic request/response schemas, with dependency-injected DB sessions and an in-memory SQLite test suite that never touches the real database.
  - Persisted reviewed tailored resumes as immutable, append-only versions per application in a foreign-keyed table, keeping tailoring a draft step that the user reviews and saves explicitly so nothing is auto-submitted.
  - Collapsed a three-layer interface of stacked slide-over panels and a modal into a single-layer view swap with tabs, keeping both tabs mounted behind CSS so switching between them neither discards unsaved edits nor re-runs a paid model call.
  - Added an opt-in grouping view that collects several applications to one employer under a shared header, reconciling inconsistent company spellings through a shared normalization function and ordering groups by their soonest deadline.
  - Introduced a Vitest suite for the frontend's pure logic (duplicate matching, status lists, grouping) alongside the existing pytest suite, writing the tests around the failure modes that silently produce wrong output rather than around coverage.
  - Built an AI resume-tailoring pipeline that selects and rephrases bullets from a YAML master resume against a job description using Claude (Opus via structured outputs, constrained to never invent content), then renders a one-page PDF through a locked Jinja and WeasyPrint template, separating content from format so the model cannot alter layout.
  - 'Deployed to production on a DigitalOcean droplet (Ubuntu): the built React frontend and FastAPI backend are served same-origin behind Caddy, the backend runs under systemd, and the site is exposed over HTTPS through a Cloudflare Tunnel with no open ports or public IP, backed by nightly pg_dump database backups.'
  - Automated deployment with a GitHub Actions pipeline so every push to main rebuilds, runs migrations, and restarts the app on the droplet, connecting as a least-privilege deploy user allowed only a single scoped sudo command.
