[project]
name = "job-tracker-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    # Used directly by services/fetch_posting.py. Already present as an
    # anthropic dependency, declared here because we now import it ourselves.
    "httpx",
    "pyyaml",
    "jinja2",
    "weasyprint==69",
    "pyjwt",
    "bcrypt",
    "psycopg[binary]",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
